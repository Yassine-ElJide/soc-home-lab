<!--
  Add this block to /var/ossec/etc/ossec.conf on IDS-01 so the Wazuh agent
  forwards Suricata EVE JSON alerts to the manager.
  Then: sudo systemctl restart wazuh-agent
-->
<ossec_config>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/suricata/eve.json</location>
  </localfile>
</ossec_config>
